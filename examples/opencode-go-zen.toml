# OpenCode Go and Zen templates. Keep protocol selection explicit per endpoint.
# Sources: https://opencode.ai/zen/go/v1/models and https://opencode.ai/docs/zen

[[providers]]
id = "opencode-go"
protocol = "openai"
base_url = "https://opencode.ai/zen/go/v1"
api_key = "${OPENCODE_API_KEY}"
models = [{ id = "mimo-v2.5-pro", name = "MiMo V2.5 Pro" }]

