[workspace]
resolver = "2"
members = [
    "crates/grey-core",
    "crates/grey-provider",
    "crates/grey-tools",
    "crates/grey-tui",
    "crates/grey-lsp",
    "crates/grey-cli",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"
authors = ["Grey Team"]

[workspace.dependencies]
anyhow = "1.0"
async-stream = "0.3"
base64 = "0.22"
bytes = "1"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
futures-util = "0.3"
globset = "0.4"
ignore = "0.4"
keyring = { version = "3", features = ["apple-native", "linux-native", "windows-native"] }
lsp-types = "0.97"
ratatui = "0.29"
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
toml_edit = "0.22"
tokio = { version = "1.40", features = ["full"] }
process-wrap = { version = "9.1.0", default-features = false, features = ["job-object", "kill-on-drop", "process-group", "tokio1"] }
pulldown-cmark = "0.12"
toml = "0.8"
unicode-width = "0.2"
uuid = { version = "1", features = ["v4"] }
tiktoken-rs = "0.6"
sha2 = "0.10"
hex = "0.4"
wasmtime = { version = "47.0.3", default-features = false, features = ["cranelift", "runtime", "std"] }
wasmtime-wasi = { version = "47.0.3", default-features = false, features = ["p1"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
