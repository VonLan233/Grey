[workspace]
resolver = "2"
members = [
    "crates/grey-core",
    "crates/grey-provider",
    "crates/grey-tools",
    "crates/grey-tui",
    "crates/grey-lsp",
    "crates/grey-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Grey Team"]

[workspace.dependencies]
anyhow = "1.0"
async-stream = "0.3"
bytes = "1"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
futures-util = "0.3"
globset = "0.4"
ignore = "0.4"
lsp-types = "0.97"
ratatui = "0.29"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
toml_edit = "0.22"
tokio = { version = "1.40", features = ["full"] }
toml = "0.8"
unicode-width = "0.2"
uuid = { version = "1", features = ["v4"] }
tiktoken-rs = "0.6"
sha2 = "0.10"
hex = "0.4"

[profile.release]
lto = true
codegen-units = 1
strip = true
