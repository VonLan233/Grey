<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Black Hole</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('scene');
  var ctx = canvas.getContext('2d');

  var W = 0, H = 0, DPR = 1;

  // ---------- starfield ----------
  var LAYERS = 3;               // parallax depth layers
  var STAR_COUNT = 260;         // stars per layer
  var stars = [];
  var twinkle = [];

  function rand(min, max) {
    return min + Math.random() * (max - min);
  }

  function initStars() {
    stars = [];
    for (var l = 0; l < LAYERS; l++) {
      stars.push([]);
      for (var i = 0; i < STAR_COUNT; i++) {
        stars[l].push({
          x: Math.random(),
          y: Math.random(),
          r: rand(0.4, 1.6) * (0.4 + l * 0.4),
          a: rand(0.3, 1),
          tw: rand(0.5, 2.5),   // twinkle speed
          ph: rand(0, Math.PI * 2)
        });
      }
    }
    twinkle = [];
    for (var k = 0; k < 200; k++) {
      twinkle.push({
        x: Math.random(),
        y: Math.random(),
        r: rand(0.2, 0.7),
        ph: rand(0, Math.PI * 2),
        sp: rand(1, 4)
      });
    }
  }

  // ---------- black hole geometry ----------
  // We render the accretion disk as an ellipse (tilted ring) around the hole.
  var BH = {
    x: 0, y: 0,
    r: 0,                 // black disk radius
    ringR: 0,             // outer photon ring radius
    diskOuter: 0,         // outer accretion disk radius
    tilt: 0.32,           // y-axis squish (viewing angle)
    rot: 0                // disk rotation phase (radians)
  };

  function layout() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    var scale = Math.min(W, H);
    BH.x = W / 2;
    BH.y = H / 2;
    BH.r = scale * 0.075;
    BH.ringR = BH.r * 1.55;
    BH.diskOuter = BH.r * 4.2;
  }

  // ---------- drawing ----------
  function drawStars(t) {
    for (var l = 0; l < LAYERS; l++) {
      // deeper layers drift slower -> subtle parallax
      var drift = l * 3;
      for (var i = 0; i < stars[l].length; i++) {
        var s = stars[l][i];
        var x = (s.x * W - t * drift) % W;
        if (x < 0) x += W;
        var tw = 0.6 + 0.4 * Math.sin(t * s.tw + s.ph);
        ctx.globalAlpha = s.a * tw;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(x, s.y * H, s.r, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    // small random twinkles near the top (sparser field)
    ctx.globalAlpha = 1;
  }

  function drawBlackHole(t) {
    var bx = BH.x, by = BH.y;
    var r = BH.r;
    var ring = BH.ringR;
    var outer = BH.diskOuter;
    BH.rot += 0.004; // continuous rotation

    // --- accretion disk: a few stacked elliptical bands with gradients ---
    // Use a radial+linear gradient clipped to an ellipse to fake the heated disk.
    for (var band = 0; band < 14; band++) {
      var f = band / 14;                       // 0 (inner) -> 1 (outer)
      var rad = ring + (outer - ring) * (f * f); // denser heat near the hole
      var halfW = rad;
      var halfH = rad * BH.tilt;

      var grad = ctx.createLinearGradient(
        bx - halfW, by,
        bx + halfW, by
      );

      if (f < 0.5) {
        // hot inner disk: bright yellow-white through orange to deep red
        grad.addColorStop(0, 'rgba(255,255,255,0.0)');
        grad.addColorStop(0.25, 'rgba(255,255,255,0.0)');
        grad.addColorStop(0.5, 'rgba(255,240,200,0.95)');
        grad.addColorStop(0.85, 'rgba(255,140,40,0.6)');
        grad.addColorStop(1, 'rgba(255,60,20,0.15)');
      } else {
        // cooler outer disk: red/dark fading into the void
        grad.addColorStop(0, 'rgba(255,90,30,0.0)');
        grad.addColorStop(0.2, 'rgba(255,90,30,0.0)');
        grad.addColorStop(0.45, 'rgba(255,80,30,0.5)');
        grad.addColorStop(1, 'rgba(60,10,5,0.0)');
      }

      ctx.save();
      ctx.translate(bx, by);
      ctx.rotate(BH.rot * (1.6 - f));          // differential rotation
      ctx.globalAlpha = 0.5;
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.ellipse(0, 0, halfW, halfH, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // --- photon ring: bright glowing circle just outside the black disk ---
    var ringGrad = ctx.createRadialGradient(bx, by, r * 0.9, bx, by, ring);
    ringGrad.addColorStop(0, 'rgba(255,220,150,0)');
    ringGrad.addColorStop(0.55, 'rgba(255,230,180,0.25)');
    ringGrad.addColorStop(0.78, 'rgba(255,255,230,0.95)');
    ringGrad.addColorStop(0.88, 'rgba(255,220,150,0.6)');
    ringGrad.addColorStop(1, 'rgba(255,200,120,0)');
    ctx.save();
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = ringGrad;
    ctx.beginPath();
    ctx.arc(bx, by, ring, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // --- black event horizon ---
    var holeGrad = ctx.createRadialGradient(bx, by, 0, bx, by, r);
    holeGrad.addColorStop(0, '#000000');
    holeGrad.addColorStop(0.75, '#000000');
    holeGrad.addColorStop(0.97, '#0a0a0a');
    holeGrad.addColorStop(1, '#1a1208'); // dark rim meeting the ring
    ctx.fillStyle = holeGrad;
    ctx.beginPath();
    ctx.arc(bx, by, r, 0, Math.PI * 2);
    ctx.fill();
  }

  function frame(t) {
    var time = t / 1000;
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, W, H);

    drawStars(time);
    drawBlackHole(time);

    requestAnimationFrame(frame);
  }

  // ---------- responsiveness ----------
  function onResize() {
    layout();
    initStars();
  }
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', onResize);

  onResize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
