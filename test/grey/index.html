<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Black Hole</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }
</style>
</head>
<body>
<canvas id="bh"></canvas>
<script>
(function () {
  'use strict';

  const canvas = document.getElementById('bh');
  const ctx = canvas.getContext('2d');

  let W = 0, H = 0, DPR = 1;

  // ---- Starfield data ----
  const STARS = 320;
  let stars = [];

  // ---- Black hole / disk parameters (relative to min dimension) ----
  const cfg = {
    horizonR: 0.11,   // event horizon radius (black circle)
    photonR: 0.17,    // photon ring radius
    diskOuter: 0.55,  // accretion disk outer radius
    diskInner: 0.18,  // accretion disk inner radius (falls behind horizon)
    diskTilt: 0.35,   // vertical squash factor -> perceived tilt
    diskAlpha: 0.55,
    warp: 2.6         // gravitational lensing strength for the ring glow
  };

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    initStars();
  }

  function initStars() {
    const count = Math.round(STARS * (W * H) / (1920 * 1080));
    stars = [];
    for (let i = 0; i < count; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.3 + 0.2,
        base: Math.random() * Math.PI * 2,
        speed: 0.4 + Math.random() * 2.4,
        depth: 0.3 + Math.random() * 0.7
      });
    }
  }

  // Draw a faint lensed glow ring just outside the horizon
  function drawPhotonRing(cx, cy, R) {
    const grad = ctx.createRadialGradient(cx, cy, R * 0.72, cx, cy, R * 1.15);
    grad.addColorStop(0, 'rgba(0,0,0,0)');
    grad.addColorStop(0.55, 'rgba(255,214,150,0.06)');
    grad.addColorStop(0.82, 'rgba(255,240,210,0.95)');
    grad.addColorStop(0.92, 'rgba(255,210,150,0.85)');
    grad.addColorStop(1, 'rgba(255,180,120,0.0)');
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(1, 0.55 + 0.15 * Math.sin(Date.now() / 1400));
    ctx.translate(-cx, -cy);
    ctx.beginPath();
    ctx.arc(cx, cy, R * 1.15, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.restore();
  }

  // Accretion disk: concentric gradient rings drawn as an ellipse
  function drawAccretionDisk(cx, cy) {
    const t = Date.now() / 12000;
    const scaleY = 1 - cfg.diskTilt; // squash -> tilt illusion

    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(1, scaleY);

    const outer = cfg.diskOuter * Math.min(W, H);
    const inner = cfg.diskInner * Math.min(W, H);

    // Draw from outer to inner so brighter inner layers sit on top
    const steps = 90;
    for (let i = steps; i >= 1; i--) {
      const f = i / steps;
      const r = inner + (outer - inner) * f;

      // Doppler-ish brightness: brighter on one side of the disk
      const doppler = 0.8 + 0.35 * f * Math.sin(f * Math.PI * 4 + t * 2);

      // Build a ring sector style gradient along the radius
      const g = ctx.createRadialGradient(0, 0, r * 0.55, 0, 0, r * 1.05);
      const hot = 'rgba(255,180,90,';
      const warm = 'rgba(200,110,60,';
      const cold = 'rgba(90,60,120,';

      const a = cfg.diskAlpha * f * 0.9;
      g.addColorStop(0, cold + (a * 0.55 * doppler) + ')');
      g.addColorStop(0.45, warm + (a * 0.8 * doppler) + ')');
      g.addColorStop(0.75, hot + (a * doppler) + ')');
      g.addColorStop(1, 'rgba(0,0,0,0)');

      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.fillStyle = g;
      ctx.fill();
    }

    // Subtle motion shimmer lines
    ctx.globalCompositeOperation = 'lighter';
    for (let k = 0; k < 40; k++) {
      const rr = inner + (outer - inner) * (k / 40);
      ctx.strokeStyle = 'rgba(255,220,160,0.06)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(0, 0, rr, t + k * 0.3, t + k * 0.3 + 1.6);
      ctx.stroke();
    }
    ctx.restore();
  }

  function draw(t) {
    // Clear with black
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    const cx = W / 2;
    const cy = H / 2;
    const minDim = Math.min(W, H);

    // ---- Starfield ----
    for (let i = 0; i < stars.length; i++) {
      const s = stars[i];
      const tw = 0.5 + 0.5 * Math.sin(t * 0.001 * s.speed + s.base);
      const alpha = (0.35 + 0.65 * tw) * s.depth;
      ctx.fillStyle = 'rgba(255,255,255,' + alpha.toFixed(3) + ')';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }

    // ---- Accretion disk (behind the black hole / photon ring) ----
    drawAccretionDisk(cx, cy);

    // ---- Photon ring ----
    drawPhotonRing(cx, cy, cfg.photonR * minDim);

    // ---- Event horizon: pure black circle ----
    const horizon = cfg.horizonR * minDim;
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(cx, cy, horizon, 0, Math.PI * 2);
    ctx.fill();

    // Thin edge glow hugging the horizon for definition
    const rim = ctx.createRadialGradient(cx, cy, horizon * 0.85, cx, cy, horizon * 1.06);
    rim.addColorStop(0, 'rgba(0,0,0,0)');
    rim.addColorStop(0.85, 'rgba(255,200,130,0.55)');
    rim.addColorStop(1, 'rgba(255,160,90,0)');
    ctx.fillStyle = rim;
    ctx.beginPath();
    ctx.arc(cx, cy, horizon * 1.06, 0, Math.PI * 2);
    ctx.fill();

    // Slight soft glow around the whole system
    const halo = ctx.createRadialGradient(cx, cy, horizon, cx, cy, minDim * 0.9);
    halo.addColorStop(0, 'rgba(40,20,10,0.25)');
    halo.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = halo;
    ctx.beginPath();
    ctx.arc(cx, cy, minDim * 0.9, 0, Math.PI * 2);
    ctx.fill();

    requestAnimationFrame(draw);
  }

  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
